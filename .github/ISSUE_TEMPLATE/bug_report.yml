name: Bug report
description: Report a reproducible problem with the Beszel Home Assistant integration.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove passwords,
        tokens, email addresses, public URLs, and serial numbers from logs.

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: The installed beszel-ha release, for example 1.3.0.
      placeholder: 1.3.0
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true

  - type: input
    id: beszel_versions
    attributes:
      label: Beszel Hub and Agent versions
      description: Include both versions when possible.
      placeholder: Hub 0.18.8, Agent 0.18.8
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual installation
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Monitored system
      description: Operating system and architecture of the affected Beszel Agent.
      placeholder: Debian 13, x86_64

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and which entities are affected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs
      description: Enable debug logging if possible and redact all sensitive data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and other sensitive data from this report.
          required: true

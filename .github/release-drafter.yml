name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    semver-increment: minor
    when:
      labels: ['enhancement', 'feature']
  - title: '🐛 Bug Fixes'
    when:
      labels: ['bug', 'fix']
  - title: '🔒 Security'
    when:
      labels: ['security']
  - title: '📦 Dependencies'
    when:
      labels: ['dependencies', 'github_actions']
  - title: '📝 Documentation'
    when:
      labels: ['documentation']
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed
  $CHANGES

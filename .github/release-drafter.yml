name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - type: pre-exclude
    when:
      label: 'skip-changelog'
  - title: '🚀 Features'
    semver-increment: minor
    when:
      labels: ['enhancement']
  - title: '🐛 Bug Fixes'
    when:
      labels: ['bug']
  - title: '🔒 Security'
    when:
      labels: ['security']
  - title: '📦 Dependencies'
    when:
      labels: ['dependencies', 'github_actions']
  - title: '🔖 Version Bumps'
    when:
      labels: ['version_bump']
  - title: '📝 Documentation'
    when:
      labels: ['documentation']
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed
  $CHANGES
